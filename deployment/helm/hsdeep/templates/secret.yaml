{{- if not .Values.secrets.existingSecret -}}
# Chart-managed application Secret. Prefer secrets.existingSecret (External
# Secrets / Sealed Secrets) in real deployments; these inline defaults are
# placeholders and production startup will refuse them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hsdeep.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hsdeep.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  SECRET_ENCRYPTION_KEY: {{ required "secrets.secretEncryptionKey is required" .Values.secrets.secretEncryptionKey | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  PRTG_DEV_USERNAME: {{ .Values.secrets.prtgDevUsername | quote }}
  PRTG_DEV_PASSHASH: {{ .Values.secrets.prtgDevPasshash | quote }}
  PNETLAB_PASSWORD: {{ .Values.secrets.pnetlabPassword | quote }}
{{- end }}
