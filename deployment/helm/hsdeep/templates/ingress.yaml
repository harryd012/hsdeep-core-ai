{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hsdeep.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hsdeep.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "hsdeep.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.roles.api.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "hsdeep.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.roles.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hsdeep.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
