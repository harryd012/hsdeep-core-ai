{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (printf "%s-sa" (include "hsdeep.fullname" .)) }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hsdeep.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application does not call the Kubernetes API in K1, so the token is not
# auto-mounted (least privilege).
automountServiceAccountToken: false
{{- end }}
