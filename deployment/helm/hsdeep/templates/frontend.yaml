apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hsdeep.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hsdeep.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "hsdeep.fullname" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hsdeep.fullname" . }}-frontend
  template:
    metadata:
      labels:
        {{- include "hsdeep.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "hsdeep.fullname" . }}-frontend
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "%s-sa" (include "hsdeep.fullname" .)) }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        runAsGroup: {{ .Values.podSecurity.runAsGroup }}
        fsGroup: {{ .Values.podSecurity.fsGroup }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.nextPublicApiUrl | quote }}
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hsdeep.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hsdeep.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "hsdeep.fullname" . }}-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "hsdeep.fullname" . }}-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
