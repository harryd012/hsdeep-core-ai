# HSDEEP CORE AI - platform observability (Prometheus + Grafana).
#
# Monitors the HSDEEP platform itself (API / worker / scheduler processes),
# never customer infrastructure. Both UIs bind to 127.0.0.1 only: nothing is
# published on a public interface. Secrets are files under ./secrets (git
# ignored), mounted read-only; no secret is ever an environment value.
#
#   cp .env.example .env
#   printf '%s' "$METRICS_BEARER_TOKEN" > secrets/metrics_token        # same value as the backend
#   openssl rand -base64 24 | tr -d '\n' > secrets/grafana_admin_password
#   docker compose up -d
#
# See README.md for production use (prometheus.production.yml).

name: hsdeep-observability

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --web.listen-address=:9090
    volumes:
      - ./prometheus/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./secrets/metrics_token:/run/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      # Lets the container reach a backend running on the host (Windows/macOS
      # Docker Desktop resolve this natively; Linux needs the host-gateway alias).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.1}
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3002}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]

  # ---------------------------------------------------------------------------
  # Phase 22: logs, traces and infrastructure metrics.
  #
  #   backend --OTLP--> otel-collector --> tempo (traces)
  #                                   \--> loki  (logs)
  #   prometheus scrapes node-exporter, cadvisor, postgres-exporter,
  #   redis-exporter and the three services above.
  #
  # Only the ports the backend on the host needs are published, on 127.0.0.1:
  # 4318 (OTLP in), 13133 (collector health), 3100 (Loki), 3200 (Tempo). The
  # exporters are reachable on the compose network only.
  # ---------------------------------------------------------------------------

  # Gives the non-root Loki and Tempo processes (uid 10001) their data
  # directories on first start, then exits.
  volume-init:
    image: busybox:${BUSYBOX_VERSION:-1.37.0}
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /loki /var/tempo"]
    volumes:
      - loki-data:/loki
      - tempo-data:/var/tempo
    restart: "no"
    network_mode: none

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.1}
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks: [observability]

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.8.1}
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/tempo/tempo.yml
      - -config.expand-env=true
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-168h}
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    networks: [observability]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.130.0}
    restart: unless-stopped
    depends_on: [loki, tempo]
    command: ["--config=/etc/otelcol/config.yml"]
    # Reading container log files needs root; leave the default unless
    # DOCKER_CONTAINERS_DIR is set (README, "Container logs").
    user: ${OTEL_COLLECTOR_USER:-10001}
    environment:
      HSDEEP_ENVIRONMENT: ${HSDEEP_ENVIRONMENT:-development}
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol/config.yml:ro
      - ${DOCKER_CONTAINERS_DIR:-./otel-collector/no-container-logs}:/var/lib/docker/containers:ro
    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    networks: [observability]

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.9.1}
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.processes
      - --web.listen-address=:9100
    pid: host
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.52.1}
    restart: unless-stopped
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --housekeeping_interval=15s
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION:-v0.17.1}
    restart: unless-stopped
    environment:
      # Host, port and database only. The password is a mounted file.
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_URI:-host.docker.internal:5432/hsdeep?sslmode=disable}
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-hsdeep_monitor}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password
    volumes:
      - ./secrets/postgres_exporter_password:/run/secrets/postgres_exporter_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.74.0-alpine}
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:-redis://host.docker.internal:6379}
      # JSON map of Redis address to password; "{}" when Redis has none.
      REDIS_PASSWORD_FILE: /run/secrets/redis_exporter_passwords.json
    volumes:
      - ./secrets/redis_exporter_passwords.json:/run/secrets/redis_exporter_passwords.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9121/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]

  # NVIDIA GPU telemetry. Starts only with `docker compose --profile gpu up -d`
  # on a host with an NVIDIA GPU and the NVIDIA container toolkit. Also copy
  # prometheus/targets/optional/gpu-nvidia.yml.example to gpu-nvidia.yml.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:${DCGM_EXPORTER_VERSION:-4.2.3-4.1.3-ubuntu22.04}
    profiles: [gpu]
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  observability:
    driver: bridge
