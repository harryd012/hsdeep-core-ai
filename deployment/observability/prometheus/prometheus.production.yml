# Production (Kubernetes): scrape every HSDEEP backend pod separately.
#
# API, worker and scheduler are separate processes (RUNTIME_MODE api /
# worker / scheduler, deployment/k8s/05-07), each with its own /metrics, so
# API metrics never contain worker or scheduler metrics. Pods are found by
# label, not by Service: only the API has a Service, and a Service would
# load-balance across replicas instead of scraping each one.
#
# The job label is the pod's app.kubernetes.io/component (api / worker /
# scheduler), which the alert rules and dashboards group by. Prometheus needs
# RBAC to list pods in the hsdeep namespace and is admitted to the backend
# ports by the backend-metrics-scrape NetworkPolicy (deployment/k8s/10).

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: hsdeep-core-ai
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: hsdeep-backend
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [hsdeep]
    relabel_configs:
      # Only HSDEEP backend pods...
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: hsdeep-backend
        action: keep
      # ...on their named "http" container port (8000 / 8001 / 8002).
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      # Not-ready pods are kept on purpose: a crash-looping pod must show as
      # up == 0 so the target-down alerts fire (their `for:` absorbs start-up).
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        target_label: component
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
