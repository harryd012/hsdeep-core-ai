# Backend SCHEDULER role — scheduler ticks only. Kept as a single replica
# (replicas: 1) so there is exactly one tick owner; the advisory lock also
# protects against accidental scale-out. HTTP listens on PORT=8002 for probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsdeep-backend-scheduler
  namespace: hsdeep
  labels: { app.kubernetes.io/part-of: hsdeep-core-ai, app.kubernetes.io/name: hsdeep-backend, app.kubernetes.io/component: scheduler }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: hsdeep-backend, app.kubernetes.io/component: scheduler }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: hsdeep-core-ai, app.kubernetes.io/name: hsdeep-backend, app.kubernetes.io/component: scheduler }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scheduler
          image: hsdeep-core-ai-backend:9a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: RUNTIME_MODE
              value: "scheduler"
            - name: PORT
              value: "8002"
          envFrom:
            - configMapRef: { name: hsdeep-config }
            - secretRef: { name: hsdeep-secrets }
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir: {}
