# SECRET TEMPLATE — DO NOT APPLY AS-IS.
#
# This file is intentionally named *.example.yaml and is EXCLUDED from
# kustomization.yaml so `kubectl apply -k deployment/k8s` never ships a
# placeholder PostgreSQL password. The Postgres StatefulSet (03-postgres.yaml)
# consumes this Secret by name `hsdeep-postgres-auth` via envFrom, so it MUST
# exist before you apply the manifests.
#
# Create the real Secret with a secret manager (External Secrets Operator,
# Sealed Secrets) or from this template AFTER replacing the values:
#
#   kubectl create secret generic hsdeep-postgres-auth -n hsdeep \
#     --from-literal=POSTGRES_DB=hsdeep \
#     --from-literal=POSTGRES_USER=hsdeep \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#
# Prefer the secret-manager path over writing the password to disk. Never commit
# real values and never paste a real password into shell history.
#
# The POSTGRES_PASSWORD here MUST match the password embedded in the
# hsdeep-secrets DATABASE_URL (see 02-secret.example.yaml) or the backend will
# fail to authenticate.
apiVersion: v1
kind: Secret
metadata:
  name: hsdeep-postgres-auth
  namespace: hsdeep
  labels:
    app.kubernetes.io/part-of: hsdeep-core-ai
    app.kubernetes.io/name: hsdeep-postgres-auth
type: Opaque
stringData:
  POSTGRES_DB: "REPLACE_ME_PG_DB"
  POSTGRES_USER: "REPLACE_ME_PG_USER"
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
