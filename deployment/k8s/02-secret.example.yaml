# SECRET TEMPLATE — DO NOT APPLY AS-IS.
#
# This file is intentionally named *.example.yaml and is EXCLUDED from
# kustomization.yaml so `kubectl apply -k` never ships placeholder credentials
# (production startup would reject them anyway). Create the real Secret with a
# secret manager instead (External Secrets Operator, Sealed Secrets, or a
# manually-applied Secret), then reference it by name `hsdeep-secrets`.
#
# Never commit real values. DATABASE_URL's password MUST match the
# hsdeep-postgres-auth Secret used by the Postgres StatefulSet.
apiVersion: v1
kind: Secret
metadata:
  name: hsdeep-secrets
  namespace: hsdeep
  labels:
    app.kubernetes.io/part-of: hsdeep-core-ai
    app.kubernetes.io/name: hsdeep-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://hsdeep:REPLACE_ME_PG_PASSWORD@hsdeep-postgres:5432/hsdeep"
  REDIS_URL: "redis://hsdeep-redis:6379/0"
  SECRET_ENCRYPTION_KEY: "REPLACE_ME_FERNET_KEY"
  JWT_SECRET_KEY: "REPLACE_ME_DISTINCT_JWT_SECRET"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  PRTG_DEV_USERNAME: ""
  PRTG_DEV_PASSHASH: ""
  PNETLAB_PASSWORD: ""
