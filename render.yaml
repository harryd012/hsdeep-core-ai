# HSDEEP CORE AI - Render Blueprint (public hosting)
#
# One Blueprint creates the whole stack from this repository:
#   hsdeep-api     web service   backend image, RUNTIME_MODE=api, runs migrations pre-deploy
#   hsdeep-worker  worker        backend image, RUNTIME_MODE=worker (scheduler ticks + RCA/EventBus consumers)
#   hsdeep-web     web service   Next.js standalone image
#   hsdeep-db      PostgreSQL    managed, daily backups (point-in-time recovery on paid plans)
#   hsdeep-redis   Key Value     Redis-compatible, internal only
#
# Secrets are never written here. Values marked `sync: false` are prompted for
# in the Render dashboard when the Blueprint is first applied; JWT and
# encryption keys are generated by Render once and then kept stable.
# See deployment/RENDER.md for the step-by-step go-live checklist.

envVarGroups:
  - name: hsdeep-backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FORCE_HTTPS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: READINESS_REQUIRE_REDIS
        value: "true"
      - key: PRTG_DEV_VERIFY_SSL
        value: "true"
      # Explicit allow-list, e.g. https://app.example.com (a wildcard is refused at startup).
      - key: CORS_ORIGINS
        sync: false
      # Stable once generated. Rotating SECRET_ENCRYPTION_KEY makes stored
      # collector credentials unreadable - never regenerate it casually.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      # Prometheus scrapers send `Authorization: Bearer <token>` to /metrics.
      # Without it, /metrics answers 404 in production.
      - key: METRICS_BEARER_TOKEN
        generateValue: true
      # Invite-only pilot: tenants are created by an operator with
      # scripts/seed_admin.py. Set to "true" for public self-serve sign-up.
      - key: PUBLIC_SIGNUP_ENABLED
        value: "false"
      # Stripe (billing checkout + webhook). Leave empty to keep billing off:
      # both routes then answer 501 instead of failing at runtime.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Outbound email (password reset, verification, invitations). "none"
      # keeps email off (those flows answer 503) until SMTP is configured:
      # set EMAIL_TRANSPORT=smtp plus SMTP_HOST / SMTP_USERNAME /
      # SMTP_PASSWORD / EMAIL_FROM. "log" is refused in production.
      - key: EMAIL_TRANSPORT
        value: none
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Public web origin for links in emails, e.g. https://app.example.com
      - key: APP_PUBLIC_URL
        sync: false

services:
  - type: web
    name: hsdeep-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Readiness: 200 only when PostgreSQL and Redis answer.
    healthCheckPath: /health/ready
    # Once per deploy, before traffic moves to the new version.
    preDeployCommand: alembic upgrade head
    autoDeploy: false
    envVars:
      - fromGroup: hsdeep-backend
      - key: RUNTIME_MODE
        value: api
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: hsdeep-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hsdeep-redis
          property: connectionString

  - type: worker
    name: hsdeep-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: false
    # Exactly one instance: scheduler ticks are also guarded by a Postgres
    # advisory lock, but a single worker keeps RCA consumers in one process.
    numInstances: 1
    envVars:
      - fromGroup: hsdeep-backend
      - key: RUNTIME_MODE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: hsdeep-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hsdeep-redis
          property: connectionString

  - type: web
    name: hsdeep-web
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    autoDeploy: false
    envVars:
      # Public API origin, e.g. https://api.example.com. NEXT_PUBLIC_* values
      # are compiled in at build time (Render passes env vars to the Docker
      # build as build args), so changing it needs a rebuild.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_AUTH_DEV_BOOTSTRAP
        value: "false"

  - type: keyvalue
    name: hsdeep-redis
    plan: starter
    region: oregon
    # Internal only: no public connections.
    ipAllowList: []
    # Queues and locks live here; never evict them under memory pressure.
    maxmemoryPolicy: noeviction

databases:
  - name: hsdeep-db
    plan: basic-1gb
    region: oregon
    databaseName: hsdeep
    user: hsdeep
    postgresMajorVersion: "16"
    # Internal only: the API and worker connect over Render's private network.
    ipAllowList: []
